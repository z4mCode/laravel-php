; Laravel base image — genel PHP varsayilanlari
;
; Resmi php image'i hicbir php.ini aktive etmez (php.ini-production dosyayi
; birakir ama kullanmaz). Bu dosya olmadan PHP'nin dahili varsayilanlari
; gecerli olur: upload_max_filesize=2M, post_max_size=8M, memory_limit=128M.
; Bu degerler Livewire dosya yuklemeleri icin fazlasiyla dusuk ve hata
; vermeden basarisiz olurlar.
;
; Bu dosya conf.d icinde zz- onekiyle yuklendigi icin en son okunur. Uygulama
; kendi degerlerini dayatmak isterse conf.d'ye alfabetik olarak sonra gelen
; bir dosya koyabilir (ornegin zzz-app.ini).

[PHP]

; --- Yukleme ve istek boyutu -------------------------------------------------
; Efektif sinir her zaman en dusuk halkadir: nginx client_max_body_size,
; post_max_size ve upload_max_filesize. Buradaki degerler bilerek yuksek
; tutuldu; asil siniri uygulamanin nginx.conf'u belirlesin.
upload_max_filesize = 1G
post_max_size = 1G
max_file_uploads = 40

; --- Bellek ve sure ----------------------------------------------------------
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
max_input_vars = 5000

; --- Hata raporlama ----------------------------------------------------------
; Uretimde hatalar cikti yerine log'a gitmeli. Laravel zaten kendi exception
; handler'ini kurar; bunlar PHP seviyesindeki fatal'lar icin gecerli.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; E_STRICT bilerek yok — PHP 8'de E_ALL icinde eritildi ve ayri sabit olarak
; kullanimi kullanimdan kaldirildi.
error_reporting = E_ALL & ~E_DEPRECATED

; --- Oturum ------------------------------------------------------------------
; Laravel kendi session surucusunu kullanir; bunlar yalnizca PHP'nin native
; session'i devreye girerse anlamli.
session.cookie_httponly = 1
session.use_strict_mode = 1

; --- Cesitli -----------------------------------------------------------------
expose_php = Off
date.timezone = UTC
realpath_cache_size = 4096k
realpath_cache_ttl = 600
