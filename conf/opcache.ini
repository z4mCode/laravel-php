; OPcache — uretim ayarlari
;
; Laravel uygulamalari cok sayida kucuk PHP dosyasi yukler (framework + vendor).
; Varsayilan opcache limitleri bu icin dar kalir ve cache surekli tasar.

[opcache]
opcache.enable = 1
opcache.enable_cli = 0

; Laravel + vendor tipik olarak 10-20 bin dosya. Sayi asilirsa opcache yeni
; dosyalari cache'lemeyi birakir, sessizce yavaslarsin.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Dosya degisikligi kontrolu acik birakildi. Container'da kod degismedigi icin
; bunu kapatmak (validate_timestamps=0) belirgin bir kazanc saglar, ancak
; container icinde dosya duzenleyen ya da runtime'da dosya ureten her seyi
; bozar. Bilerek acmak icin uygulamanin conf.d'sine su satirlari ekle:
;
;   opcache.validate_timestamps = 0
;   opcache.revalidate_freq = 0
;
; Bu durumda kod degisikligi ancak container yeniden baslayinca gorulur.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

opcache.save_comments = 1
opcache.fast_shutdown = 1

; JIT web is yuklerinde genelde olculebilir bir kazanc vermez ve hata ayiklamayi
; zorlastirir. Ihtiyac duyulursa uygulama tarafinda acilabilir:
;   opcache.jit_buffer_size = 64M
;   opcache.jit = tracing
opcache.jit_buffer_size = 0
